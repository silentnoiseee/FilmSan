name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: cinematic-roll-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Build allowlisted hosting artifact
        shell: pwsh
        run: ./scripts/build-staging.ps1

      - name: Add server-only TMDB runtime configuration
        shell: pwsh
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TMDB_API_KEY)) { throw 'TMDB_API_KEY is not configured in the staging environment.' }
          $escaped = $env:TMDB_API_KEY.Replace("'", "\\'")
          Set-Content -LiteralPath .deploy/.runtime-config.php -Value "<?php return ['tmdb_api_key' => '$escaped'];" -NoNewline

      - name: Deploy to Hostinger staging over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./.deploy/
          server-dir: ${{ secrets.HOSTINGER_STAGING_DIR }}
          dangerous-clean-slate: false
