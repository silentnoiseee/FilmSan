<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Roll — Clips</title>
<meta name="description" content="A wall of cinema in motion — looping moments from the films we love.">
<style>
  :root{ --fg:#fff; --muted:rgba(255,255,255,.58); --muted-2:rgba(255,255,255,.4);
         --line:rgba(255,255,255,.12); --bg:#080808; --ease-out:cubic-bezier(0.23,1,0.32,1); }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  .eyebrow{ font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:var(--muted-2); }

  header.masthead{ position:sticky; top:0; z-index:60; background:rgba(8,8,8,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .masthead .bar{ position:relative; display:flex; align-items:center; justify-content:center; padding:14px 16px; }
  .wordmark{ font-size:20px; font-weight:800; letter-spacing:3px; } .wordmark b{ font-weight:300; }
  .back{ position:absolute; left:16px; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.07); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; }
  .back svg{ width:17px; height:17px; fill:#fff; }
  #accountBtn{ position:absolute; right:16px; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%; background:#b9bdc2; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #accountBtn svg{ width:18px; height:18px; fill:#fff; }
  nav.nav{ display:flex; gap:16px; justify-content:center; padding:0 16px 12px; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); }
  nav.nav a.on{ color:#fff; } nav.nav .dot{ color:var(--muted-2); }

  .lead{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding:34px 16px 20px; flex-wrap:wrap; }
  .lead h1{ font-size:clamp(28px,7vw,46px); font-weight:300; letter-spacing:-1px; line-height:1; }
  .lead p{ margin-top:8px; color:var(--muted); font-size:14px; max-width:520px; line-height:1.55; }
  .shuffle{ display:inline-flex; align-items:center; gap:9px; padding:10px 16px; border:1px solid var(--line); border-radius:999px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; cursor:pointer; background:rgba(255,255,255,.04); transition:background 160ms ease, transform 140ms var(--ease-out); }
  .shuffle:active{ transform:scale(.96); } @media (hover:hover){ .shuffle:hover{ background:rgba(255,255,255,.1); } }
  .shuffle svg{ width:15px; height:15px; fill:currentColor; }

  .wall{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; padding:0 10px 70px; }
  .tile{ position:relative; aspect-ratio:16/9; border-radius:10px; overflow:hidden; background:#101010; cursor:pointer;
         transition:transform 220ms var(--ease-out); }
  .tile:active{ transform:scale(.99); }
  @media (hover:hover){ .tile:hover{ transform:translateY(-3px); } }
  .tile .pf{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .tile video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 300ms var(--ease-out); }
  .tile.playing video{ opacity:1; }
  @media(max-width:900px){.wall{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:600px){.wall{gap:5px;padding:0 5px 60px}}

  .empty{ text-align:center; color:var(--muted); padding:80px 24px 90px; line-height:1.7; }
  .empty code{ background:rgba(255,255,255,.08); padding:2px 7px; border-radius:6px; font-size:13px; color:#fff; }
  footer{ padding:40px 20px 60px; text-align:center; color:var(--muted-2); font-size:11px; letter-spacing:.1em; border-top:1px solid var(--line); }
</style>
<link rel="stylesheet" href="assets/cr-theme.css">
</head>
<body>

<header class="masthead">
  <div class="bar">
    <a class="back" href="index.html" title="Home"><svg viewBox="0 0 24 24"><path d="M15.5 4 8 12l7.5 8"/></svg></a>
    <a class="wordmark" href="index.html">Cinematic <b>Roll</b></a>
    <a id="accountBtn" href="profile.html" title="Account"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 6v1h18v-1c0-3.5-4-6-9-6z"/></svg></a>
  </div>
  <nav class="nav"><a href="films.html">Films</a><span class="dot">&middot;</span><a href="archive.html">Archive</a><span class="dot">&middot;</span><a class="on" href="clips.html">Clips</a><span class="dot">&middot;</span><a href="feed.html">The Feed</a></nav>
</header>

<div class="lead">
  <div>
    <div class="eyebrow">Clips</div>
    <h1>Cinema in motion.</h1>
    <p>A shuffled wall of looping moments — the frames, gestures and light we can't stop watching.</p>
  </div>
  <div class="shuffle" id="shuffleBtn"><svg viewBox="0 0 24 24"><path d="M18 4l3 3-3 3v-2h-3.5l-2.3 2.9-1.3-1.6L13 7h5V4zM3 7h4.5l6 7.5H18V12l3 3-3 3v-2h-5.5l-6-7.5H3V7zm0 10h4l1.3-1.6 1.3 1.6L8 19H3v-2z"/></svg> Shuffle</div>
</div>

<div id="wall" class="wall"></div>
<footer>&copy; 2026 Cinematic Roll &middot; Black cinema in motion</footer>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function slugify(film, year){ return String(film).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '-' + year; }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function filmName(name){return String(name||'').startsWith('Eyimofe')?'Eyimofe (This Is My Desire)':String(name||'')}
const BLACK_TITLES=new Set(["My Father's Shadow","Gang Tapes","Belly","Touki Bouki","Mother of George","Black Girl","Sinners","Waves","A Haunted House","L'enfant lion","Watch Where the River Divides"]);

let GIFS = [];
const wall = document.getElementById('wall');

function tileEl(g){
  const el = document.createElement('a');
  const name=filmName(g.film);
  el.className = 'tile';
  el.href = 'film.html?slug=' + encodeURIComponent(slugify(name, g.year));
  el.setAttribute('aria-label',`Open ${name} (${g.year})`);
  el.innerHTML =
    `${g.poster ? `<img class="pf" src="${esc(g.poster)}" alt="" loading="lazy" decoding="async">` : ''}
     <video autoplay muted playsinline preload="metadata" data-src="${esc(g.src)}"${g.loop?` data-loop="${+g.loop}"`:''}></video>`;
  return el;
}

// Playback engine. Sources can be Bunny HLS (.m3u8, played via hls.js) or plain
// MP4 (hand-made gifs). Only in-view tiles play, with a hard cap on how many run
// at once — a wall of clips must never exhaust the device's video decoders.
let io;
const MAX_LIVE = 8;
const live = new Set();

function attach(tile){
  if(tile._on) return;
  const v = tile.querySelector('video');
  if(!v) return;
  while(live.size >= MAX_LIVE){                 // free the oldest before starting another
    const oldest = live.values().next().value;
    if(!oldest || oldest === tile) break;
    detach(oldest);
  }
  tile._on = true; live.add(tile);
  const src = v.dataset.src;
  const onPlay = () => tile.classList.add('playing');
  if(/\.m3u8($|\?)/i.test(src) && window.Hls && Hls.isSupported()){
    const hls = new Hls({ capLevelToPlayerSize:true, maxBufferLength:4, maxMaxBufferLength:6, backBufferLength:0 });
    v._hls = hls;
    hls.loadSource(src); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().then(onPlay).catch(()=>{}));
  } else {
    if(!v.src) v.src = src;                     // plain mp4, or Safari native HLS
    v.play().then(onPlay).catch(()=>{});
  }
}
function detach(tile){
  const v = tile.querySelector('video');
  if(v){
    v.pause();
    if(v._hls){ try{ v._hls.destroy(); }catch(e){} v._hls = null; }
    v.removeAttribute('src'); try{ v.load(); }catch(e){}
  }
  tile.classList.remove('playing');
  tile._on = false; live.delete(tile);
}
function render(){
  if(io) io.disconnect();
  wall.innerHTML = '';
  if(!GIFS.length){
    wall.style.display = 'block';
    wall.innerHTML = `<div class="empty">No clips yet.<br><br>Run <code>gifs_from_bunny.bat</code> to fill this wall from films you've already uploaded, or craft your own in <code>gif_studio.html</code>. Then upload <code>gifs.json</code> and refresh.</div>`;
    return;
  }
  wall.style.display = 'grid';
  const frag = document.createDocumentFragment();
  shuffle(GIFS).forEach(g => frag.appendChild(tileEl(g)));
  wall.appendChild(frag);

  const tiles = [...wall.querySelectorAll('.tile')];
  tiles.forEach(t => {
    // Loop just the first few seconds so a long clip reads as a tight GIF
    // (and only that much data is fetched). No window => loop the whole thing.
    const v = t.querySelector('video');
    const L = +v.dataset.loop || 0;
    if (L) v.addEventListener('timeupdate', () => { if (v.currentTime >= L) v.currentTime = 0; });
    else v.loop = true;
  });

  io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) detach(e.target);
      else attach(e.target);
    });
  }, { rootMargin: '0px', threshold: 0.15 });
  tiles.forEach(t => io.observe(t));
  requestAnimationFrame(()=>tiles.forEach(t=>{const r=t.getBoundingClientRect();if(r.top<innerHeight&&r.bottom>0)attach(t)}));
}

document.getElementById('shuffleBtn').onclick = render;

(async () => {
  try { GIFS = await (await fetch('gifs.json')).json(); } catch(e) { GIFS = []; }
  if(!Array.isArray(GIFS)) GIFS = [];
  GIFS = GIFS.filter(g=>BLACK_TITLES.has(g.film)||String(g.film||'').startsWith('Eyimofe'));
  render();
})();
</script>
</body>
</html>
