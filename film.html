<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FilmFeed</title>
<style>
  :root {
    --fg:#fff; --muted:rgba(255,255,255,.58); --muted-2:rgba(255,255,255,.4);
    --line:rgba(255,255,255,.13); --bg:#0a0a0a; --card:#141414; --like:#ff3b5c;
    --ease-out:cubic-bezier(0.23,1,0.32,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  .eyebrow { font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:var(--muted-2); }
  .wrap { max-width:980px; margin:0 auto; padding:0 20px; }

  /* Masthead */
  header.masthead { position:sticky; top:0; z-index:60; background:rgba(10,10,10,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .masthead .bar { position:relative; display:flex; align-items:center; justify-content:center; padding:14px 16px; }
  .wordmark { font-size:20px; font-weight:800; letter-spacing:3px; }
  .wordmark b { font-weight:300; }
  .back { position:absolute; left:16px; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.07); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; }
  .back svg { width:17px; height:17px; fill:#fff; }
  #accountBtn { position:absolute; right:16px; top:50%; transform:translateY(-50%); min-width:34px; height:34px; padding:0 13px; border-radius:999px; background:rgba(255,255,255,.07); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:700; cursor:pointer; overflow:hidden; }
  #accountBtn.icon { width:34px; padding:0; border-radius:50%; font-size:14px; }
  #accountBtn img { width:100%; height:100%; object-fit:cover; }
  #accountBtn svg { width:18px; height:18px; fill:#fff; }

  /* Hero / backdrop */
  .backdrop { position:relative; min-height:46vh; background-size:cover; background-position:center top; background-color:#111; }
  .backdrop::after { content:""; position:absolute; inset:0; background:linear-gradient(to top, var(--bg) 4%, rgba(10,10,10,.4) 60%, rgba(10,10,10,.55)); }
  .head { position:relative; margin-top:-150px; display:flex; gap:22px; align-items:flex-end; flex-wrap:wrap; }
  .poster { width:150px; flex:0 0 auto; aspect-ratio:2/3; border-radius:12px; background:#222 center/cover; box-shadow:0 16px 40px rgba(0,0,0,.6); }
  .headmeta { flex:1; min-width:240px; }
  .headmeta h1 { font-size:clamp(28px,6vw,44px); font-weight:300; letter-spacing:-.8px; line-height:1.05; }
  .facts { margin-top:10px; color:var(--muted); font-size:13px; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
  .facts .star { color:#f5c451; }
  .genres { margin-top:12px; display:flex; flex-wrap:wrap; gap:7px; }
  .genre { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:5px 11px; }

  /* Action bar */
  .actions { display:flex; flex-wrap:wrap; gap:10px; margin:24px 0 8px; }
  .act { display:inline-flex; align-items:center; gap:8px; padding:11px 16px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.05); color:#fff; font-size:13px; font-weight:600; cursor:pointer; transition:transform 140ms var(--ease-out), background 160ms ease, border-color 160ms ease; }
  .act:active { transform:scale(.97); }
  .act svg { width:17px; height:17px; fill:currentColor; }
  .act.on { background:#fff; color:#000; border-color:#fff; }
  .act.like.on { background:rgba(255,59,92,.16); color:var(--like); border-color:rgba(255,59,92,.5); }
  .act.watch { background:#fff; color:#000; border-color:#fff; }
  .act .ct { opacity:.7; font-variant-numeric:tabular-nums; }

  section.block { padding:30px 0; border-top:1px solid var(--line); }
  section.block h2 { font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--muted-2); margin-bottom:16px; }
  .tagline { font-style:italic; color:var(--muted); margin-bottom:14px; }
  .overview { font-size:15px; line-height:1.6; color:rgba(255,255,255,.9); max-width:680px; }
  .director { margin-top:16px; font-size:14px; color:var(--muted); }
  .director b { color:#fff; font-weight:600; }

  .castrow { display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
  .castrow::-webkit-scrollbar { display:none; }
  .castcard { flex:0 0 auto; width:96px; text-align:center; }
  .castcard .ph { width:96px; height:96px; border-radius:50%; background:#222 center/cover; margin:0 auto 8px; }
  .castcard .nm { font-size:12px; font-weight:600; line-height:1.25; }
  .castcard .ch { font-size:11px; color:var(--muted-2); margin-top:2px; line-height:1.25; }

  .providers { display:flex; flex-direction:column; gap:16px; }
  .provgroup .lbl { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted-2); margin-bottom:8px; }
  .provlogos { display:flex; flex-wrap:wrap; gap:10px; }
  .provlogos img { width:42px; height:42px; border-radius:10px; background:#222; object-fit:cover; }
  .noprov { color:var(--muted-2); font-size:13px; }

  /* Comments */
  .commentbox { display:flex; gap:10px; margin-bottom:20px; }
  .commentbox textarea { flex:1; background:#151515; border:1px solid var(--line); border-radius:12px; padding:11px 13px; color:#fff; font:inherit; font-size:14px; resize:vertical; min-height:44px; }
  .commentbox button { align-self:flex-end; background:#fff; color:#000; border:none; border-radius:10px; padding:11px 18px; font-weight:700; cursor:pointer; }
  .comment { display:flex; gap:11px; padding:14px 0; border-top:1px solid var(--line); }
  .comment .av { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#3a3a3a,#161616) center/cover; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; }
  .comment .cwho { font-size:13px; font-weight:600; }
  .comment .cwhen { font-size:11px; color:var(--muted-2); margin-left:8px; }
  .comment .ctext { font-size:14px; line-height:1.5; color:rgba(255,255,255,.9); margin-top:3px; }
  .muted-note { color:var(--muted); font-size:13px; }

  footer { padding:40px 20px 60px; text-align:center; color:var(--muted-2); font-size:11px; letter-spacing:.1em; border-top:1px solid var(--line); margin-top:20px; }

  /* Modals */
  .modal { position:fixed; inset:0; z-index:120; background:rgba(0,0,0,.62); display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; visibility:hidden; transition:opacity 220ms var(--ease-out), visibility 220ms; }
  .modal.open { opacity:1; visibility:visible; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .card2 { position:relative; background:#0e0e0e; border:1px solid rgba(255,255,255,.1); border-radius:20px; padding:28px 24px; width:100%; max-width:360px; box-shadow:0 30px 80px rgba(0,0,0,.6); transform:scale(.95) translateY(8px); opacity:0; transition:transform 260ms var(--ease-out), opacity 220ms var(--ease-out); }
  .modal.open .card2 { transform:none; opacity:1; }
  .card2 h2 { font-size:22px; font-weight:700; margin-bottom:5px; }
  .card2 .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .card2 label { display:block; font-size:11px; letter-spacing:.4px; text-transform:uppercase; color:var(--muted-2); margin:14px 0 6px; }
  .card2 input { width:100%; background:#1a1a1a; border:1px solid rgba(255,255,255,.12); border-radius:11px; padding:12px 13px; color:#fff; font-size:14px; }
  .card2 input:focus { outline:none; border-color:rgba(255,255,255,.5); }
  .card2 .btn { width:100%; margin-top:18px; background:#fff; color:#000; border:none; border-radius:11px; padding:13px; font-size:15px; font-weight:700; cursor:pointer; }
  .card2 .switch { margin-top:14px; text-align:center; font-size:13px; color:var(--muted); }
  .card2 .switch a { color:#fff; cursor:pointer; font-weight:600; border-bottom:1px solid rgba(255,255,255,.3); }
  .card2 .msg { margin-top:12px; font-size:13px; min-height:16px; }
  .card2 .msg.err { color:#ff6b6b; } .card2 .msg.ok { color:#4cd964; }
  .card2 .x { position:absolute; top:14px; right:16px; font-size:24px; color:var(--muted); cursor:pointer; }
</style>
</head>
<body>

<header class="masthead">
  <div class="bar">
    <a class="back" href="index.html" title="Home"><svg viewBox="0 0 24 24"><path d="M15.5 4 8 12l7.5 8"/></svg></a>
    <a class="wordmark" href="index.html">Film<b>Feed</b></a>
    <button id="accountBtn" class="icon" title="Account">Log in</button>
  </div>
</header>

<main id="app">
  <div class="wrap" style="padding-top:60px;"><p class="muted-note" id="loading">Loading film…</p></div>
</main>

<footer>&copy; 2026 FilmFeed &middot; Film data from TMDB</footer>

<div class="modal" id="authModal"><div class="card2">
  <div class="x" id="authClose">&times;</div>
  <h2 id="authTitle">Log in</h2>
  <div class="sub" id="authSub">Welcome back to FilmFeed.</div>
  <label>Username</label><input id="authUser" autocomplete="username" placeholder="3–30 letters, numbers, _">
  <label>Password</label><input id="authPass" type="password" autocomplete="current-password" placeholder="At least 6 characters">
  <button class="btn" id="authSubmit">Log in</button>
  <div class="msg" id="authMsg"></div>
  <div class="switch" id="authSwitch">New here? <a>Create an account</a></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
console.log('FilmFeed film page: v2 (gray profile avatar)');
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function timeAgo(d){ const s=(Date.now()-new Date(d))/1000; if(s<60)return'just now'; if(s<3600)return Math.floor(s/60)+'m'; if(s<86400)return Math.floor(s/3600)+'h'; if(s<2592000)return Math.floor(s/86400)+'d'; return new Date(d).toLocaleDateString(); }

const SB_URL='https://dykfcvjdfuvsonswojgd.supabase.co';
const SB_KEY='sb_publishable_iiq__E3kX-J7BzX_FN1nmg_mV5fLhiz';
const sb = window.supabase.createClient(SB_URL, SB_KEY);
let user=null, profile=null;
const slug = new URLSearchParams(location.search).get('slug');
let film=null;

const ICONS = {
  plus:'<path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/>',
  check:'<path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/>',
  heart:'<path d="M12 21s-7.5-4.9-10-9.2C.6 9.1 2 5 6 5c2.2 0 3.5 1.2 4.3 2.4l1.7 2.3 1.7-2.3C14.5 6.2 15.8 5 18 5c4 0 5.4 4.1 4 6.8C19.5 16.1 12 21 12 21z"/>',
  play:'<path d="M8 5v14l11-7z"/>',
  person:'<path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 6v1h18v-1c0-3.5-4-6-9-6z"/>'
};

// Load the film catalog (deployed alongside the page)
async function loadFilms(){ const r = await fetch('films.json'); return await r.json(); }

function providersHTML(wp){
  const region = wp && (wp.US || wp.GB || wp.CA || wp.AU);
  if(!region) return '<div class="noprov">No streaming info available right now.</div>';
  const grp = (label, arr) => arr && arr.length ? `<div class="provgroup"><div class="lbl">${label}</div><div class="provlogos">${arr.map(p=>`<img src="${esc(p.logo)}" alt="${esc(p.name)}" title="${esc(p.name)}">`).join('')}</div></div>` : '';
  const html = grp('Stream', region.stream) + grp('Rent', region.rent) + grp('Buy', region.buy);
  return html || '<div class="noprov">No streaming info available right now.</div>';
}

function render(){
  if(!film){ document.getElementById('app').innerHTML = '<div class="wrap" style="padding-top:60px"><p class="muted-note">Film not found.</p></div>'; return; }
  document.title = `${film.title} (${film.year}) — FilmFeed`;
  const cast = (film.cast_list||[]).map(c=>`<div class="castcard"><div class="ph" style="background-image:url('${esc(c.photo_url||'')}')"></div><div class="nm">${esc(c.name)}</div>${c.character?`<div class="ch">${esc(c.character)}</div>`:''}</div>`).join('');
  document.getElementById('app').innerHTML = `
    <div class="backdrop" style="background-image:url('${esc(film.backdrop_url||film.poster_url||'')}')"></div>
    <div class="wrap">
      <div class="head">
        <div class="poster" style="background-image:url('${esc(film.poster_url||'')}')"></div>
        <div class="headmeta">
          <h1>${esc(film.title)}</h1>
          <div class="facts">
            <span>${esc(film.year)}</span>
            ${film.runtime?`<span>&middot; ${Math.floor(film.runtime/60)}h ${film.runtime%60}m</span>`:''}
            ${film.tmdb_rating?`<span>&middot; <span class="star">&#9733;</span> ${Number(film.tmdb_rating).toFixed(1)}</span>`:''}
            ${film.director?`<span>&middot; Dir. ${esc(film.director)}</span>`:''}
          </div>
          <div class="genres">${(film.genres||[]).map(g=>`<span class="genre">${esc(g)}</span>`).join('')}</div>
        </div>
      </div>

      <div class="actions">
        <button class="act" id="btnWatchlist"><svg viewBox="0 0 24 24">${ICONS.plus}</svg> Watchlist</button>
        <button class="act" id="btnWatched"><svg viewBox="0 0 24 24">${ICONS.check}</svg> Watched</button>
        <button class="act like" id="btnLike"><svg viewBox="0 0 24 24">${ICONS.heart}</svg> Like <span class="ct" id="likeCt"></span></button>
        <a class="act watch" href="feed.html#film=${encodeURIComponent(film.feed_key||'')}"><svg viewBox="0 0 24 24">${ICONS.play}</svg> Watch in the feed</a>
      </div>

      <section class="block">
        <h2>Synopsis</h2>
        ${film.tagline?`<div class="tagline">&ldquo;${esc(film.tagline)}&rdquo;</div>`:''}
        <div class="overview">${esc(film.overview||'No synopsis available.')}</div>
        ${film.director?`<div class="director">Directed by <b>${esc(film.director)}</b></div>`:''}
      </section>

      ${cast?`<section class="block"><h2>Cast</h2><div class="castrow">${cast}</div></section>`:''}

      <section class="block"><h2>Where to watch</h2><div class="providers">${providersHTML(film.watch_providers)}</div></section>

      <section class="block"><h2>Comments</h2>
        <div id="commentArea"></div>
      </section>
    </div>`;
  wireActions();
  renderComments();
}

// ---------- tracking ----------
function setActive(el, on, onClass){ el.classList.toggle('on', !!on); if(onClass) el.classList.toggle(onClass, !!on); }
let state = { watchlist:false, watched:false, liked:false, likeCount:0 };

async function loadState(){
  const [{count}, likeMine, uf] = await Promise.all([
    sb.from('film_likes').select('*',{count:'exact',head:true}).eq('film_slug',slug),
    user ? sb.from('film_likes').select('film_slug').eq('film_slug',slug).eq('user_id',user.id).maybeSingle() : Promise.resolve({data:null}),
    user ? sb.from('user_films').select('status').eq('film_slug',slug).eq('user_id',user.id).maybeSingle() : Promise.resolve({data:null})
  ]);
  state.likeCount = count||0;
  state.liked = !!(likeMine && likeMine.data);
  state.watchlist = uf.data && uf.data.status==='watchlist';
  state.watched = uf.data && uf.data.status==='watched';
  reflect();
}
function reflect(){
  const wl=document.getElementById('btnWatchlist'), wd=document.getElementById('btnWatched'), lk=document.getElementById('btnLike');
  if(!wl) return;
  setActive(wl, state.watchlist); setActive(wd, state.watched);
  lk.classList.toggle('on', state.liked);
  document.getElementById('likeCt').textContent = state.likeCount ? state.likeCount : '';
}
async function setStatus(target){
  if(!user) return openAuth('login');
  const current = state.watched ? 'watched' : state.watchlist ? 'watchlist' : null;
  if(current === target){ // toggle off
    state.watchlist=false; state.watched=false; reflect();
    await sb.from('user_films').delete().eq('user_id',user.id).eq('film_slug',slug);
  } else {
    state.watchlist = target==='watchlist'; state.watched = target==='watched'; reflect();
    await sb.from('user_films').upsert({user_id:user.id, film_slug:slug, status:target});
  }
}
async function toggleLike(){
  if(!user) return openAuth('login');
  if(state.liked){ state.liked=false; state.likeCount=Math.max(0,state.likeCount-1); reflect(); await sb.from('film_likes').delete().eq('user_id',user.id).eq('film_slug',slug); }
  else { state.liked=true; state.likeCount++; reflect(); await sb.from('film_likes').upsert({user_id:user.id, film_slug:slug}); }
}
function wireActions(){
  document.getElementById('btnWatchlist').onclick = () => setStatus('watchlist');
  document.getElementById('btnWatched').onclick = () => setStatus('watched');
  document.getElementById('btnLike').onclick = toggleLike;
  loadState();
}

// ---------- comments ----------
async function renderComments(){
  const area = document.getElementById('commentArea');
  const { data } = await sb.from('film_comments').select('id,body,created_at,profiles(username,avatar_url)').eq('film_slug',slug).order('created_at',{ascending:false}).limit(100);
  const box = user
    ? `<div class="commentbox"><textarea id="ctext" maxlength="2000" placeholder="Share your thoughts…"></textarea><button id="cpost">Post</button></div>`
    : `<p class="muted-note" style="margin-bottom:18px"><a id="cLogin" style="color:#fff;border-bottom:1px solid rgba(255,255,255,.3);cursor:pointer">Log in</a> to join the conversation.</p>`;
  const list = (data&&data.length) ? data.map(c=>{
    const u=c.profiles||{}; const av=u.avatar_url; const init=((u.username||'U').charAt(0)).toUpperCase();
    return `<div class="comment"><div class="av" style="${av?`background-image:url('${esc(av)}')`:''}">${av?'':esc(init)}</div><div><div><span class="cwho">@${esc(u.username||'user')}</span><span class="cwhen">${timeAgo(c.created_at)}</span></div><div class="ctext">${esc(c.body)}</div></div></div>`;
  }).join('') : '<p class="muted-note">No comments yet — be the first.</p>';
  area.innerHTML = box + list;
  const lg=document.getElementById('cLogin'); if(lg) lg.onclick=()=>openAuth('login');
  const post=document.getElementById('cpost'); if(post) post.onclick=async()=>{
    const t=document.getElementById('ctext').value.trim(); if(!t) return;
    post.disabled=true;
    const {error}=await sb.from('film_comments').insert({user_id:user.id, film_slug:slug, body:t});
    post.disabled=false;
    if(!error){ document.getElementById('ctext').value=''; renderComments(); }
  };
}

// ---------- accounts ----------
const USER_EMAIL_DOMAIN='users.cinematicroll.com';
const authModal=document.getElementById('authModal'); let authMode='login';
function refreshAccountBtn(){ const b=document.getElementById('accountBtn'); b.className='icon'; const a=user&&profile&&profile.avatar_url; if(a){ b.innerHTML=`<img src="${esc(a)}">`; b.style.background='rgba(255,255,255,.07)'; } else { b.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 6v1h18v-1c0-3.5-4-6-9-6z"/></svg>'; b.style.background='#b9bdc2'; } b.title=user?'Your profile':'Log in'; }
document.getElementById('accountBtn').onclick=()=>{ if(user){ location.href='profile.html'; } else openAuth('login'); };
function openAuth(m){ authMode=m||'login'; renderAuthMode(); document.getElementById('authMsg').textContent=''; authModal.classList.add('open'); }
function renderAuthMode(){ const l=authMode==='login'; document.getElementById('authTitle').textContent=l?'Log in':'Create account'; document.getElementById('authSub').textContent=l?'Welcome back to FilmFeed.':'Join FilmFeed to track films.'; document.getElementById('authSubmit').textContent=l?'Log in':'Sign up'; document.getElementById('authSwitch').innerHTML=l?'New here? <a>Create an account</a>':'Have an account? <a>Log in</a>'; }
document.getElementById('authClose').onclick=()=>authModal.classList.remove('open');
document.getElementById('authSwitch').onclick=()=>{ authMode=authMode==='login'?'signup':'login'; renderAuthMode(); };
document.getElementById('authSubmit').onclick=async()=>{
  const un=document.getElementById('authUser').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  const pw=document.getElementById('authPass').value; const msg=document.getElementById('authMsg'); msg.className='msg'; msg.textContent='Working…';
  if(un.length<3||un.length>30){ msg.className='msg err'; msg.textContent='Username must be 3–30 letters, numbers, or _.'; return; }
  if(pw.length<6){ msg.className='msg err'; msg.textContent='Password must be at least 6 characters.'; return; }
  const email=un+'@'+USER_EMAIL_DOMAIN;
  const res=authMode==='signup'?await sb.auth.signUp({email,password:pw}):await sb.auth.signInWithPassword({email,password:pw});
  if(res.error){ msg.className='msg err'; msg.textContent=/already registered|already exists/i.test(res.error.message)?'That username is taken.':/invalid login/i.test(res.error.message)?'Wrong username or password.':res.error.message; return; }
  if(authMode==='signup'&&!res.data.session){ msg.className='msg err'; msg.textContent='Signups are blocked until "Confirm email" is OFF in Supabase.'; return; }
  authModal.classList.remove('open');
};

sb.auth.onAuthStateChange((_e,session)=>{
  user=session?.user||null;
  refreshAccountBtn();
  if(user){ setTimeout(async()=>{ const {data}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle(); profile=data; refreshAccountBtn(); if(film){ loadState(); renderComments(); } },0); }
  else { profile=null; if(film){ loadState(); renderComments(); } }
});

(async()=>{
  const all = await loadFilms();
  film = all.find(f=>f.slug===slug) || null;
  render();
})();
</script>
</body>
</html>
