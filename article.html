<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Roll — Feature</title>
<style>
  :root{
    --fg:#fff; --muted:rgba(255,255,255,.58); --muted-2:rgba(255,255,255,.4);
    --line:rgba(255,255,255,.13); --bg:#0a0a0a; --ease-out:cubic-bezier(0.23,1,0.32,1);
    --serif: Georgia, "Times New Roman", "Iowan Old Style", serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;}
  a{color:inherit;text-decoration:none;}
  .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted-2);}

  header.masthead{position:sticky;top:0;z-index:60;background:rgba(10,10,10,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
  .masthead .bar{position:relative;display:flex;align-items:center;justify-content:center;padding:14px 16px;}
  .wordmark{font-size:20px;font-weight:800;letter-spacing:3px;}
  .wordmark b{font-weight:300;}
  .back{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .back svg{width:17px;height:17px;fill:#fff;}
  #accountBtn{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:#b9bdc2;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;}
  #accountBtn svg{width:18px;height:18px;fill:#fff;}

  .wrap{max-width:720px;margin:0 auto;padding:0 22px;}

  .arthead{padding:54px 0 10px;}
  .arthead .cat{color:#fff;}
  .arthead h1{font-size:clamp(34px,8vw,60px);font-weight:300;letter-spacing:-1.2px;line-height:1.04;margin:16px 0 0;}
  .arthead .dek{margin-top:18px;font-size:18px;line-height:1.5;color:rgba(255,255,255,.82);font-family:var(--serif);font-style:italic;}
  .byline{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;}
  .byline .sep{color:var(--muted-2);}

  figure{margin:34px 0;}
  figure.lead{margin:34px 0 8px;}
  figure img{width:100%;height:auto;display:block;border-radius:12px;background:#141414;}
  figure.full{max-width:980px;margin-left:auto;margin-right:auto;}
  figure.player video{width:100%;display:block;border-radius:12px;background:#000;}
  figcaption{margin-top:10px;font-size:12px;color:var(--muted-2);letter-spacing:.02em;text-align:center;}

  .body{padding:8px 0 10px;}
  .body p{font-family:var(--serif);font-size:18px;line-height:1.72;color:rgba(255,255,255,.9);margin:0 0 22px;}
  .body p:first-of-type::first-letter{font-size:58px;line-height:.8;font-weight:600;float:left;padding:4px 10px 0 0;color:#fff;font-family:-apple-system,sans-serif;}

  .pullquote{margin:38px 0;padding:6px 0 6px 22px;border-left:2px solid #f5c451;}
  .pullquote p{font-family:var(--serif);font-style:italic;font-size:24px;line-height:1.4;color:#fff;}

  .endmark{margin:30px 0 8px;color:var(--muted-2);font-size:13px;letter-spacing:.3em;text-transform:uppercase;}

  .more{border-top:1px solid var(--line);margin-top:30px;padding:34px 0 10px;}
  .more .lbl{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted-2);margin-bottom:14px;}
  .more .links{display:flex;gap:14px;flex-wrap:wrap;}
  .more a{padding:11px 18px;border:1px solid var(--line);border-radius:999px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;transition:background 160ms ease,transform 140ms var(--ease-out);}
  .more a:active{transform:scale(.97);}
  @media (hover:hover){.more a:hover{background:rgba(255,255,255,.07);}}

  footer{padding:50px 22px 64px;text-align:center;color:var(--muted-2);border-top:1px solid var(--line);margin-top:36px;}
  footer .wm{font-size:16px;font-weight:800;letter-spacing:2px;color:#fff;}
  footer .wm b{font-weight:300;}
  footer .copy{margin-top:12px;font-size:11px;letter-spacing:.1em;}

  .center-note{padding:90px 20px;text-align:center;color:var(--muted);}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}
</style>
<link rel="stylesheet" href="assets/cr-theme.css">
</head>
<body>

<header class="masthead">
  <div class="bar">
    <a class="back" href="index.html" title="Home"><svg viewBox="0 0 24 24"><path d="M15.5 4 8 12l7.5 8"/></svg></a>
    <a class="wordmark" href="index.html">Cinematic <b>Roll</b></a>
    <a id="accountBtn" href="profile.html" title="Account"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 6v1h18v-1c0-3.5-4-6-9-6z"/></svg></a>
  </div>
</header>

<main id="app"><div class="wrap"><p class="center-note">Loading…</p></div></main>

<script>
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(d){ try{ return new Date(d).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }catch(e){ return d; } }

const slug = new URLSearchParams(location.search).get('slug');

(async ()=>{
  let articles = [];
  try{ articles = await (await fetch('articles.json')).json(); }catch(e){}
  const a = articles.find(x => x.slug === slug) || (!slug && articles[0]) || null;
  const app = document.getElementById('app');
  if(!a){ app.innerHTML = '<div class="wrap"><p class="center-note">Article not found.</p></div>'; return; }
  document.title = `${a.title} — Cinematic Roll`;

  const body = a.body || [];
  // Insert the pull quote after the 4th paragraph, the video (if any) around
  // two-thirds in, and the film still nearby (nudged so they never collide).
  const quoteAt = Math.min(4, body.length);
  const videoAt = a.video ? Math.min(body.length, Math.max(quoteAt + 1, Math.floor(body.length * 0.66))) : -1;
  let stillAt = a.still ? Math.min(body.length, Math.max(quoteAt + 1, body.length - 3)) : -1;
  if (stillAt !== -1 && stillAt === videoAt) stillAt = Math.min(body.length, stillAt + 2);

  let html = '';
  body.forEach((p, i) => {
    if(i === quoteAt && a.pullquote){
      html += `<div class="pullquote"><p>&ldquo;${esc(a.pullquote)}&rdquo;</p></div>`;
    }
    if(i === videoAt && a.video){
      html += `<figure class="full player"><video src="${esc(a.video)}"${a.video_poster?` poster="${esc(a.video_poster)}"`:''} controls playsinline preload="metadata"></video>${a.video_caption?`<figcaption>${esc(a.video_caption)}</figcaption>`:''}</figure>`;
    }
    if(i === stillAt && a.still){
      html += `<figure class="full"><img src="${esc(a.still)}" alt="${esc(a.still_caption||a.title)}" loading="lazy">${a.still_caption?`<figcaption>${esc(a.still_caption)}</figcaption>`:''}</figure>`;
    }
    html += `<p>${esc(p)}</p>`;
  });
  if(a.pullquote && quoteAt >= body.length){ html = `<div class="pullquote"><p>&ldquo;${esc(a.pullquote)}&rdquo;</p></div>` + html; }

  const author = /^filmfeed$/i.test(a.author||'') ? 'Cinematic Roll' : a.author;
  const byline = [author ? 'By ' + esc(author) : '', a.location ? esc(a.location) : '', a.date ? fmtDate(a.date) : '']
    .filter(Boolean).map(t=>`<span>${t}</span>`).join('<span class="sep">&middot;</span>');

  app.innerHTML = `
    <div class="wrap">
      <div class="arthead">
        <div class="eyebrow cat">${esc(a.category||'Feature')}</div>
        <h1>${esc(a.title)}</h1>
        ${a.dek?`<p class="dek">${esc(a.dek)}</p>`:''}
        <div class="byline">${byline}</div>
      </div>
      ${a.portrait?`<figure class="lead"><img src="${esc(a.portrait)}" alt="${esc(a.title)}"></figure>`:''}
      <div class="body">${html}<div class="endmark">&mdash; Cinematic Roll</div></div>
      <div class="more">
        <div class="lbl">Keep exploring</div>
        <div class="links">
          <a href="archive.html">The Archive</a>
          <a href="feed.html">The Feed</a>
          <a href="films.html">Films</a>
        </div>
      </div>
    </div>
    <footer><div class="wm">Cinematic<b> Roll</b></div><div class="copy">&copy; 2026 Cinematic Roll &middot; Black cinema in motion</div></footer>`;
})();
</script>
</body>
</html>
